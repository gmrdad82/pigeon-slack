# A version tag builds and publishes the three files that make a plugin release.
name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the WebAssembly target
        run: rustup target add wasm32-wasip2
      - name: Build the plugin
        run: cargo build --release --target wasm32-wasip2
      - name: Stage the plugin artifact
        run: cp target/wasm32-wasip2/release/pigeon_slack.wasm plugin.wasm
      - name: Record the artifact hash
        run: sha256sum plugin.wasm > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin.toml plugin.wasm SHA256SUMS --generate-notes --verify-tag
